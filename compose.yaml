name: velotheque

services:
  db:
    build: docker/db
    image: velotheque-db:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      VELOTHEQUE_RO_PASSWORD: ${VELOTHEQUE_RO_PASSWORD}
    volumes:
      - ${VELOTHEQUE_DATA_DIR:-./data}/postgres:/var/lib/postgresql
      - ./docker/db/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: velotheque-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${VELOTHEQUE_DATA_DIR:-./data}:/data
    ports:
      - "127.0.0.1:8000:8000"
